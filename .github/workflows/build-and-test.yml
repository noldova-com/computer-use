name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    uses: noldova-com/.github/.github/workflows/build-and-test.yml@fd77a920a674e4c9369f34d799329ac93793c8a2 # v2.39.1
    permissions:
      contents: read
      packages: read
    with:
      targets: ${{ github.event_name != 'pull_request' && 'linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64' || 'linux-x64 windows-x64 macos-arm64' }}
      publishes: true
      end-to-end: e2e
      end-to-end-prepare: npm run test:e2e:prepare
      end-to-end-report: _build/e2e
      unprivileged-user-namespaces: true
      timeout-minutes: 20

  versions:
    name: Versions
    uses: noldova-com/.github/.github/workflows/versions.yml@fd77a920a674e4c9369f34d799329ac93793c8a2 # v2.39.1
    permissions: {}

  desktop-end-to-end:
    name: Desktop end-to-end, ${{ matrix.label }}
    needs: versions
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            label: Windows x64
            runs-on: windows-2025
          - target: macos-arm64
            label: macOS arm64
            runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Check the npm version
        env:
          NPM_VERSION: ${{ needs.versions.outputs.npm-version }}
        run: |
          installed="$(npm --version)"
          if [ -n "$NPM_VERSION" ] && [ "$installed" != "$NPM_VERSION" ]; then
            echo "::error::npm is $installed, not the $NPM_VERSION every other job checks."
            exit 1
          fi

      - name: Install the dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare the fixture app
        run: npm run test:e2e:prepare

      - name: Grant the test app on the hosted macOS runner
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: npm run test:e2e:grant-hosted-macos

      - name: Run the desktop end-to-end spec
        run: npm run test:e2e:desktop

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-end-to-end-${{ matrix.target }}
          path: _build/e2e
          if-no-files-found: ignore
          retention-days: 14
